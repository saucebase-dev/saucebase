name: Tests

on:
    # No `branches:` filter on purpose. That key matches the PR's *base* branch, so an
    # allowlist silently skips CI for every epic branch (dev-v3, dev-improvements, ...)
    # — and a skipped run shows as no checks at all, which reads like success.
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    phpunit-raw:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        name: PHPUnit (raw)

        steps:
            - uses: actions/checkout@v5

            - uses: ./.github/actions/setup-laravel
              with:
                  skip-build: 'true'

            - name: Run tests
              run: php artisan test

    phpunit:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: phpunit-raw
        strategy:
            matrix:
                framework: [vue, react]
        name: PHPUnit (${{ matrix.framework }})

        steps:
            - uses: actions/checkout@v5

            - uses: ./.github/actions/setup-laravel
              with:
                  framework: ${{ matrix.framework }}

            - name: Run tests
              run: php artisan test

    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        needs: phpunit
        strategy:
            matrix:
                framework: [vue, react]
        name: E2E (${{ matrix.framework }})

        steps:
            - uses: actions/checkout@v5

            - uses: ./.github/actions/setup-laravel
              with:
                  framework: ${{ matrix.framework }}

            - name: Install Playwright
              run: npx playwright install chromium --with-deps

            # Playwright starts the server itself (laravelServer() in playwright.config.ts).
            - name: Prepare E2E environment
              run: php artisan playwright:env --force

            - name: Run E2E tests
              run: npm run test:e2e

            - name: Upload test report
              if: failure()
              uses: actions/upload-artifact@v6
              with:
                  name: playwright-report-${{ matrix.framework }}
                  path: playwright-report/
                  retention-days: 7
