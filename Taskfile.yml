# https://taskfile.dev
version: '3'

vars:
  # Prefix for running commands in a containerized environment (e.g., 'docker compose exec app')
  APP: '' 

includes:
    # ── BEGIN MODULES ────────────────────────────────────────────────
    # ── END MODULES ──────────────────────────────────────────────────

tasks:
    # ── Development ───────────────────────────────────────────────

    dev:
        desc: Start vite dev server (with HMR)
        cmd: npm run dev

    serve:
        desc: Start dev server (app, queue, logs, vite)
        cmd: composer dev

    queue:
        desc: Run the queue worker (restarts when code changes)
        cmd: '{{.APP}} php artisan queue:listen --tries=1 --timeout=0'

    schedule:
        desc: Run the scheduler (runs due tasks every minute)
        cmd: '{{.APP}} php artisan schedule:work'

    workers:
        desc: Run the queue worker and scheduler together
        deps: [queue, schedule]
        failfast: true # one stopping stops both (Task 3.46.1+), so jobs never pile up unprocessed

    build:
        desc: Production build (includes SSR)
        cmd: npm run build
    
    artisan:
        desc: 'Run artisan commands. Eg: task artisan -- route:list'
        cmd: '{{.APP}} php artisan {{.CLI_ARGS}}'
    
    composer:
        desc: 'Run composer commands. Eg: task composer -- update'
        cmd: '{{.APP}} composer {{.CLI_ARGS}}'

    # ── Code quality ──────────────────────────────────────────────

    lint:
        desc: Run all linters (PHP + JS)
        cmds:
            - task: lint:php
            - task: lint:js

    lint:php:
        internal: true
        cmd: vendor/bin/pint

    lint:js:
        internal: true
        cmd: npm run lint

    format:
        desc: Prettier write
        cmd: npm run format

    analyse:
        desc: PHPStan static analysis (level 5)
        cmd: vendor/bin/phpstan analyse --memory-limit=2G

    # ── Testing ───────────────────────────────────────────────────

    test:php:
        desc: Run PHPUnit tests
        cmd: php artisan test {{.CLI_ARGS}}
        interactive: true

    test:unit:
        desc: Run frontend unit tests (lib/ code, Vitest)
        cmd: npm run test:unit {{.CLI_ARGS}}

    test:e2e:
        desc: Run E2E tests
        cmd: npm run test:e2e {{.CLI_ARGS}}
        interactive: true
    test:e2e:single:
        desc: Run E2E tests with single worker
        cmd: npm run test:e2e -- --workers=1 --max-failures=1 {{.CLI_ARGS}}
        interactive: true

    # ── Helpers ───────────────────────────────────────────────────

    db:reset:
        desc: Reset the app and E2E databases (migrate:fresh + module seeds; DEMO=--demo adds sample content)
        prompt: This will erase ALL data, in the E2E database too. Are you sure?
        # Checked before anything runs. Without .env.e2e, --env=e2e loads .env, and a cached
        # config or exported DB_* variables do the same: the E2E reset would wipe the app's database.
        preconditions:
            - sh: test -f .env.e2e
              msg: '.env.e2e is missing. Create it with: php artisan playwright:env'
            - sh: |
                  db='echo config("database.default").":".config("database.connections.".config("database.default").".database");'
                  [ "$(php artisan tinker --env=e2e --execute="$db" 2>/dev/null)" != "$(php artisan tinker --execute="$db" 2>/dev/null)" ]
              msg: 'The E2E environment resolves to the app database (check .env.e2e, a cached config, or exported DB_* variables). Nothing was reset.'
        cmds:
            - '{{.APP}} php artisan migrate:fresh --seed'
            - '{{.APP}} php artisan modules:seed {{.DEMO}}'
            # On the host, like the E2E run itself; its server only migrates, so an
            # edited migration needs this to apply there.
            - php artisan migrate:fresh --env=e2e --force

    db:reset:demo:
        desc: Reset the app and E2E databases and load sample content (the auth module's demo includes an admin)
        cmds:
            - task: db:reset
              vars: { DEMO: '--demo' }

    db:seed:demo:
        desc: Seed every module with sample content
        cmd: '{{.APP}} php artisan modules:seed --demo'

    # ── Translation ───────────────────────────────────────────────

    translation:export:
        desc: 'Add missing strings from the app and every module to lang/<LOCALE>.json (task translation:export LOCALE=pt_BR)'
        requires:
            vars: [LOCALE]
        cmd: '{{.APP}} php artisan translatable:export {{.LOCALE}}'

    translation:missing:
        desc: 'List strings still untranslated in lang/<LOCALE>.json (task translation:missing LOCALE=pt_BR)'
        requires:
            vars: [LOCALE]
        cmd: '{{.APP}} php artisan translatable:inspect-translations {{.LOCALE}}'

    # ── Pipelines ─────────────────────────────────────────────────

    check:
        desc: Full quality pipeline (lint + analyse + test)
        cmds:
            - task: lint
            - task: analyse
            - task: test:php
            - task: test:e2e
